title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-template-areas: |
        "greet media living other"
        "temp humidity weather laundry"
        "downloads downloads batteries batteries"
      grid-gap: 16px
      margin: 8px
      mediaquery:
        # phone -> 1 column (checked first)
        "(max-width: 700px)":
          grid-template-columns: minmax(0, 1fr)
          grid-template-areas: |
            "greet"
            "media"
            "living"
            "other"
            "temp"
            "humidity"
            "weather"
            "laundry"
            "downloads"
            "batteries"
        # tablet / small laptop -> 2 columns
        "(max-width: 1100px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-template-areas: |
            "greet media"
            "living other"
            "temp humidity"
            "weather laundry"
            "downloads batteries"
    cards:
      # ===== greet + scenes + climate =====
      - type: vertical-stack
        view_layout: {grid-area: greet}
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set h = now().hour %}{% if h < 5 %}Good night{% elif h < 10 %}Good
              morning{% elif h < 18 %}Hello{% else %}Good evening{% endif %}, BK
            secondary: >-
              {{ now().strftime('%A %d %B, %H:%M') }} · {{ states('weather.forecast_home') }},
              {{ state_attr('weather.forecast_home', 'temperature') }}°
            icon: mdi:home-heart
            icon_color: amber
            multiline_secondary: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: person.bjorn_kristian_punsvik
                content_info: name
              - type: entity
                entity: person.camilla
                content_info: name
          - type: custom:mushroom-title-card
            title: Scenes
            title_tag: h3
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                content: Morning
                icon: mdi:coffee
                icon_color: brown
                tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.morning}}
              - type: template
                content: Day
                icon: mdi:weather-sunny
                icon_color: yellow
                tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.day}}
              - type: template
                content: Cozy
                icon: mdi:sofa
                icon_color: amber
                tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.cozy}}
              - type: template
                content: Evening
                icon: mdi:weather-sunset
                icon_color: deep-orange
                tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.evening}}
              - type: template
                content: Night
                icon: mdi:weather-night
                icon_color: indigo
                tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.night}}
          - type: custom:mushroom-title-card
            title: Climate
            title_tag: h3
          - type: custom:mushroom-template-card
            primary: Living Room
            secondary: "{{ states('sensor.living_room_temperature') }}° · {{ states('sensor.living_room_humidity') }}%"
            icon: mdi:sofa
            icon_color: >-
              {% set t = states('sensor.living_room_temperature') | float(0) %}
              {% if t > 25 %}red{% elif t < 19 %}blue{% else %}green{% endif %}
          - type: custom:mushroom-template-card
            primary: Office
            secondary: "{{ states('sensor.office_temperature') }}° · {{ states('sensor.office_humidity') }}%"
            icon: mdi:desk
            icon_color: >-
              {% set t = states('sensor.office_temperature') | float(0) %}
              {% if t > 25 %}red{% elif t < 19 %}blue{% else %}green{% endif %}
          - type: custom:mushroom-template-card
            primary: Outside
            secondary: "{{ states('sensor.outside_temperature') }}° · {{ states('sensor.outside_humidity') }}%"
            icon: mdi:tree
            icon_color: >-
              {% set t = states('sensor.outside_temperature') | float(0) %}
              {% if t > 25 %}red{% elif t < 0 %}blue{% else %}green{% endif %}

      # ===== media =====
      - type: vertical-stack
        view_layout: {grid-area: media}
        cards:
          - type: custom:mushroom-title-card
            title: Media
            title_tag: h3
          - type: custom:mushroom-media-player-card
            entity: media_player.tv_universal
            name: Living Room TV
            use_media_info: true
            media_controls: [play_pause_stop]
            volume_controls: [volume_buttons, volume_slider]
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                content: Jellyfin
                icon: mdi:jellyfish
                tap_action: {action: perform-action, perform_action: script.watch_jellyfin}
              - type: template
                content: Prime
                icon: mdi:filmstrip
                tap_action: {action: perform-action, perform_action: script.watch_prime}
              - type: template
                content: Spotify
                icon: mdi:spotify
                tap_action: {action: perform-action, perform_action: script.watch_spotify}
              - type: template
                content: YouTube
                icon: mdi:youtube
                tap_action: {action: perform-action, perform_action: script.watch_youtube}
          - type: media-control
            entity: media_player.spotify_bjorn_kristian_punsvik

      # ===== living =====
      - type: vertical-stack
        view_layout: {grid-area: living}
        cards:
          - type: custom:mushroom-title-card
            title: Living Room
            title_tag: h3
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_shelf
                name: Shelf
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.living_room_window
                name: Window
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_1
                name: Spot 1
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_2
                name: Spot 2
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_3
                name: Spot 3
                show_brightness_control: true

      # ===== other =====
      - type: vertical-stack
        view_layout: {grid-area: other}
        cards:
          - type: custom:mushroom-title-card
            title: Other rooms
            title_tag: h3
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-light-card
                entity: light.kitchen_light
                name: Kitchen
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.hall_cabinet
                name: Hall
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.office_ceiling
                name: Office
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.bedroom_ceiling
                name: Bedroom
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.bedroom_night
                name: Night light
                show_brightness_control: true

      # ===== temperature history =====
      - type: vertical-stack
        view_layout: {grid-area: temp}
        cards:
          - type: custom:mushroom-title-card
            title: Climate history
            title_tag: h3
          - type: history-graph
            title: Temperature (24h)
            hours_to_show: 24
            entities:
              - {entity: sensor.living_room_temperature, name: Living Room}
              - {entity: sensor.office_temperature, name: Office}
              - {entity: sensor.outside_temperature, name: Outside}

      # ===== humidity history =====
      - type: vertical-stack
        view_layout: {grid-area: humidity}
        cards:
          - type: custom:mushroom-title-card
            title: " "
            title_tag: h3
          - type: history-graph
            title: Humidity (24h)
            hours_to_show: 24
            entities:
              - {entity: sensor.living_room_humidity, name: Living Room}
              - {entity: sensor.office_humidity, name: Office}
              - {entity: sensor.outside_humidity, name: Outside}

      # ===== weather (spans 2 rows) =====
      - type: vertical-stack
        view_layout: {grid-area: weather}
        cards:
          - type: custom:mushroom-title-card
            title: Weather
            title_tag: h3
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
          - type: custom:hourly-weather
            entity: weather.forecast_home
            name: Next hours

      # ===== laundry =====
      - type: vertical-stack
        view_layout: {grid-area: laundry}
        cards:
          - type: custom:mushroom-title-card
            title: Laundry
            title_tag: h3
          - type: custom:mushroom-template-card
            primary: Washing machine
            secondary: "{{ states('sensor.washing_machine_machine_state') }}"
            icon: mdi:washing-machine
            icon_color: "{{ 'blue' if is_state('sensor.washing_machine_machine_state','run') else 'grey' }}"
          - type: custom:mushroom-template-card
            primary: Tumble dryer
            secondary: "{{ states('sensor.tumble_dryer_machine_state') }}"
            icon: mdi:tumble-dryer
            icon_color: "{{ 'blue' if is_state('sensor.tumble_dryer_machine_state','run') else 'grey' }}"

      # ===== downloads =====
      - type: vertical-stack
        view_layout: {grid-area: downloads}
        cards:
          - type: custom:mushroom-title-card
            title: Downloads
            title_tag: h3
          - type: custom:mushroom-template-card
            primary: qBittorrent
            secondary: "↓ {{ states('sensor.qbittorrent_download_speed') }} · ↑ {{ states('sensor.qbittorrent_upload_speed') }} kB/s"
            icon: mdi:download
          - type: custom:mushroom-template-card
            primary: Sonarr
            secondary: "{{ states('sensor.sonarr_upcoming') }} upcoming"
            icon: mdi:television-classic
          - type: custom:mushroom-template-card
            primary: Radarr
            secondary: "{{ states('sensor.radarr_films') }} films"
            icon: mdi:movie-open

      # ===== batteries (wide) =====
      - type: vertical-stack
        view_layout: {grid-area: batteries}
        cards:
          - type: custom:mushroom-title-card
            title: Batteries
            title_tag: h3
          - type: entities
            entities:
              - {entity: sensor.office_climate_battery, name: Office climate}
              - {entity: sensor.outside_climate_battery, name: Outside climate}
              - {entity: sensor.living_room_climate_battery, name: Living Room climate}
              - {entity: sensor.bedroom_dimmer_battery, name: Bedroom dimmer}
              - {entity: sensor.living_room_remote_battery, name: Living Room remote}
