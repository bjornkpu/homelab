title: Tablet
views:
  - title: Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-template-areas: |
        "header header header"
        "scenes scenes scenes"
        "living other media"
        "living other climate"
      grid-gap: 12px
      margin: 8px
      mediaquery:
        # phone -> 1 column (checked first)
        "(max-width: 700px)":
          grid-template-columns: minmax(0, 1fr)
          grid-template-areas: |
            "header"
            "scenes"
            "living"
            "other"
            "media"
            "climate"
        # portrait tablet -> 2 columns
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-template-areas: |
            "header header"
            "scenes scenes"
            "living other"
            "media climate"
    cards:
      # ===== header =====
      - type: custom:mushroom-template-card
        view_layout: {grid-area: header}
        primary: >-
          {% set h = now().hour %}{% if h < 5 %}Good night{% elif h < 10 %}Good
          morning{% elif h < 18 %}Hello{% else %}Good evening{% endif %}, BK
        secondary: >-
          {{ now().strftime('%H:%M') }} · {{ states('weather.forecast_home') }},
          {{ state_attr('weather.forecast_home', 'temperature') }}°
        icon: mdi:home-heart
        icon_color: amber
        multiline_secondary: true

      # ===== scenes =====
      - type: custom:layout-card
        view_layout: {grid-area: scenes}
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr))
          grid-gap: 8px
        cards:
          - type: custom:mushroom-template-card
            primary: Morning
            icon: mdi:coffee
            icon_color: brown
            layout: vertical
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.morning}}
          - type: custom:mushroom-template-card
            primary: Day
            icon: mdi:weather-sunny
            icon_color: yellow
            layout: vertical
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.day}}
          - type: custom:mushroom-template-card
            primary: Cozy
            icon: mdi:sofa
            icon_color: amber
            layout: vertical
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.cozy}}
          - type: custom:mushroom-template-card
            primary: Evening
            icon: mdi:weather-sunset
            icon_color: deep-orange
            layout: vertical
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.evening}}
          - type: custom:mushroom-template-card
            primary: Night
            icon: mdi:weather-night
            icon_color: indigo
            layout: vertical
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.night}}

      # ===== living room lights =====
      - type: vertical-stack
        view_layout: {grid-area: living}
        cards:
          - type: custom:mushroom-title-card
            title: Living Room
            title_tag: h3
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_shelf
                name: Shelf
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.living_room_window
                name: Window
                show_brightness_control: true
                use_light_color: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_1
                name: Spot 1
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_2
                name: Spot 2
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.living_room_spot_3
                name: Spot 3
                show_brightness_control: true

      # ===== other rooms lights =====
      - type: vertical-stack
        view_layout: {grid-area: other}
        cards:
          - type: custom:mushroom-title-card
            title: Other rooms
            title_tag: h3
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-light-card
                entity: light.kitchen_light
                name: Kitchen
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.hall_cabinet
                name: Hall
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.office_ceiling
                name: Office
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.bedroom_ceiling
                name: Bedroom
                show_brightness_control: true
              - type: custom:mushroom-light-card
                entity: light.bedroom_night
                name: Night light
                show_brightness_control: true

      # ===== media =====
      - type: vertical-stack
        view_layout: {grid-area: media}
        cards:
          - type: custom:mushroom-title-card
            title: Media
            title_tag: h3
          - type: custom:mushroom-media-player-card
            entity: media_player.tv_universal
            name: Living Room TV
            use_media_info: true
            media_controls: [play_pause_stop]
            volume_controls: [volume_buttons]
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-template-card
                primary: Jellyfin
                icon: mdi:jellyfish
                icon_color: purple
                layout: vertical
                tap_action: {action: perform-action, perform_action: script.watch_jellyfin}
              - type: custom:mushroom-template-card
                primary: Prime
                icon: mdi:filmstrip
                icon_color: light-blue
                layout: vertical
                tap_action: {action: perform-action, perform_action: script.watch_prime}
              - type: custom:mushroom-template-card
                primary: Spotify
                icon: mdi:spotify
                icon_color: green
                layout: vertical
                tap_action: {action: perform-action, perform_action: script.watch_spotify}
              - type: custom:mushroom-template-card
                primary: YouTube
                icon: mdi:youtube
                icon_color: red
                layout: vertical
                tap_action: {action: perform-action, perform_action: script.watch_youtube}

      # ===== climate =====
      - type: vertical-stack
        view_layout: {grid-area: climate}
        cards:
          - type: custom:mushroom-title-card
            title: Climate
            title_tag: h3
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(auto-fit, minmax(110px, 1fr))
              grid-gap: 8px
            cards:
              - type: custom:mushroom-template-card
                primary: Living Room
                secondary: "{{ states('sensor.living_room_temperature') }}°"
                icon: mdi:sofa
                layout: vertical
                icon_color: >-
                  {% set t = states('sensor.living_room_temperature') | float(0) %}
                  {% if t > 25 %}red{% elif t < 19 %}blue{% else %}green{% endif %}
              - type: custom:mushroom-template-card
                primary: Office
                secondary: "{{ states('sensor.office_temperature') }}°"
                icon: mdi:desk
                layout: vertical
                icon_color: >-
                  {% set t = states('sensor.office_temperature') | float(0) %}
                  {% if t > 25 %}red{% elif t < 19 %}blue{% else %}green{% endif %}
              - type: custom:mushroom-template-card
                primary: Outside
                secondary: "{{ states('sensor.outside_temperature') }}°"
                icon: mdi:tree
                layout: vertical
                icon_color: >-
                  {% set t = states('sensor.outside_temperature') | float(0) %}
                  {% if t > 25 %}red{% elif t < 0 %}blue{% else %}green{% endif %}

  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: clock
            clock_size: large
            show_seconds: false
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
          - type: custom:hourly-weather
            entity: weather.forecast_home
            name: Next hours
