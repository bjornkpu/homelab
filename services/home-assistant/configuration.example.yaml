# Reference copy of configuration.yaml — the real file is NOT tracked in git.
#
# The TrueNAS Home Assistant app injects the Postgres recorder db_url (with the
# DB password in cleartext) into configuration.yaml on every deploy, so the live
# file is gitignored to keep the secret out of the repo. Set the DB password via
# the TrueNAS app UI: Apps > home-assistant > Edit > Database Password.
#
# Do NOT use `!secret` for db_url: the app overwrites that line on deploy and HA
# drops into recovery mode.
#
# Keep `http:` inline, never `!include`: the app injects http.server_port on
# deploy and mangles an `!include` line into an invalid config (crash loop).

default_config:
tts:
  - platform: google_translate
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
recorder:
  purge_keep_days: 30
  commit_interval: 3
  db_url: postgresql://home-assistant:REDACTED@postgres:5432/home-assistant?sslmode=disable
google_assistant: !include google_assistant.yaml
http:
  server_port: 8123
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.1.4
    - 172.16.0.0/12
  ip_ban_enabled: true
  login_attempts_threshold: 5
homeassistant:
  packages: !include_dir_named packages
lovelace:
  dashboards:
    tablet-home:
      mode: yaml
      title: Tablet
      icon: mdi:tablet-dashboard
      filename: dashboards/tablet.yaml
      show_in_sidebar: true
    web-home:
      mode: yaml
      title: Home
      icon: mdi:home
      filename: dashboards/home.yaml
      show_in_sidebar: true
    hallway-day:
      mode: yaml
      title: Hallway
      icon: mdi:coat-rack
      filename: dashboards/hallway.yaml
      show_in_sidebar: false
