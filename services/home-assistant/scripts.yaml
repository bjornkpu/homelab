tv_ensure_on:
  alias: TV ensure on
  icon: mdi:television
  sequence:
  - if:
    - condition: state
      entity_id: media_player.living_room_tv
      state:
      - 'off'
      - unavailable
    then:
    - action: button.press
      target:
        entity_id: button.living_room_tv_power
    - wait_template: >-
        {{ not is_state('media_player.living_room_tv', 'unavailable')
           and not is_state('media_player.living_room_tv', 'off') }}
      timeout: '00:00:30'
      continue_on_timeout: false
    - delay: '00:00:03'
  mode: single
watch_spotify:
  alias: Spotify
  icon: mdi:spotify
  sequence:
  - action: script.tv_ensure_on
  - action: media_player.select_source
    target:
      entity_id: media_player.living_room_tv
    data:
      source: Spotify - Music and Podcasts
  mode: single
watch_youtube:
  alias: YouTube
