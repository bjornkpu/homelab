# Bazarr - Subtitle management for Sonarr/Radarr libraries
# https://github.com/linuxserver/docker-bazarr
#
# Watches the Sonarr and Radarr libraries, downloads missing subtitles
# from configured providers and writes .srt sidecars next to the video
# files, where Jellyfin picks them up on scan.

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Oslo
    volumes:
      - /mnt/main/appdata/bazarr:/config
      - /mnt/main/media:/media
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.punsvik.net`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=le
      - traefik.http.routers.bazarr.middlewares=internal-only@file,security-headers@file
      - traefik.http.services.bazarr.loadbalancer.server.port=6767

networks:
  traefik:
    external: true
    name: traefik
