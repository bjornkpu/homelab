services:
  shopping-list:
    container_name: shopping-list
    image: ghcr.io/bjornkpu/shopping-list:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      HOUSEHOLD_ID: ${HOUSEHOLD_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shopping-list.rule=Host(`shopping-list.furuknappen.no`)"
      - "traefik.http.routers.shopping-list.entrypoints=websecure"
      - "traefik.http.routers.shopping-list.tls.certresolver=le"
      - "traefik.http.routers.shopping-list.middlewares=security-headers@file"
      - "traefik.http.services.shopping-list.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      retries: 3
      timeout: 5s
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik
